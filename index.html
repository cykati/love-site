<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const text = "I love you";
  const wordColor = "#00BFFF"; // Один цвет, как на видео
  const points = [];

  function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }

  const scale = 45; // Большое сердце

  // Заполняем всё сердце, но с разбросом, чтобы не было "кучи"
  for (let i = 0; i < 800; i++) {
    const t = Math.random() * 2 * Math.PI;
    const r = Math.random(); 
    
    // Добавляем случайное смещение, чтобы слова не наезжали друг на друга
    const jitterX = (Math.random() - 0.5) * 15;
    const jitterY = (Math.random() - 0.5) * 15;

    points.push({
      x: heartX(t) * scale * r + jitterX,
      y: heartY(t) * scale * r + jitterY,
      size: Math.random() * 8 + 6,
      alpha: 0,
      speed: Math.random() * 0.03 + 0.01
    });
  }

  // Сортировка сверху вниз
  points.sort((a, b) => b.y - a.y);

  let time = 0;
  const totalPoints = points.length;

  function animate() {
    time += 0.1;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const offsetX = canvas.width / 2;
    const offsetY = canvas.height / 2 + (canvas.height * 0.1); 

    points.forEach((p, index) => {
      const delay = index * 0.005; 
      
      if (time > delay) {
        if (p.alpha < 1) p.alpha += p.speed;
      }

      if (p.alpha > 0) {
        const flicker = Math.sin(time * 3 + index) * 0.2 + 0.8;
        
        ctx.globalAlpha = p.alpha * flicker;
        ctx.font = `bold ${p.size}px Arial`;
        ctx.fillStyle = wordColor; // Все одного цвета
        ctx.fillText(text, offsetX + p.x, offsetY - p.y);
      }
    });

    // Большая надпись "I Love You" в самом конце
    if (time > totalPoints * 0.005 + 2) {
      const bigFlicker = Math.sin(time * 2) * 0.2 + 0.8;
      ctx.globalAlpha = bigFlicker;
      
      ctx.shadowColor = "#00BFFF";
      ctx.shadowBlur = 30;
      
      ctx.font = `bold ${Math.min(canvas.width / 5, 100)}px Georgia`; 
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText("I Love You", offsetX, offsetY - (canvas.height * 0.15));
      
      ctx.shadowBlur = 0;
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    points.forEach(p => p.alpha = 0);
    time = 0;
    animate();
  });
</script>
</body>
</html>
