<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const text = "I love you";
  const outlinePoints = [];
  const fillPoints = [];

  function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }

  const scale = 6.5;

  // === ЗАПОЛНЕНИЕ ===
  // Идём по координатной сетке X/Y и проверяем, внутри ли точка.
  // Но делаем это в правильных пропорциях, чтобы края заполнялись тоже.

  // Границы сердца (по формуле): X от -16 до 16, Y от -17 до 13
  const xMin = -16, xMax = 16;
  const yMin = -17, yMax = 13;

  // Шаг сетки
  const stepX = 0.5;
  const stepY = 0.5;

  for (let x = xMin; x <= xMax; x += stepX) {
    for (let y = yMin; y <= yMax; y += stepY) {
      
      // Небольшое смещение для естественности
      const px = x + (Math.random() - 0.5) * stepX * 0.6;
      const py = y + (Math.random() - 0.5) * stepY * 0.6;

      // Проверка внутри сердца по параметрической формуле
      // Находим ближайший угол t
      let inside = false;
      for (let t = 0; t < 2 * Math.PI; t += 0.05) {
        const hx = heartX(t);
        const hy = heartY(t);
        // Простая проверка: точка внутри, если она близка к форме
        // Используем нормализованное сравнение
        const dist = Math.sqrt((px - hx) * (px - hx) + (py - hy) * (py - hy));
        if (dist < 1.5) {
          // Точка на границе — тоже оставим
        }
      }

      // Более надёжная проверка через уравнение сердца:
      // (x² + y² - 1)³ - x²y³ <= 0
      const nx = px / 16;
      const ny = py / 13;
      const a = nx * nx + ny * ny - 1;
      if (a * a * a - nx * nx * ny * ny * ny <= 0) {
        fillPoints.push({
          x: px * scale,
          y: py * scale,
          size: 7,
          alpha: 0,
          delay: 0
        });
      }
    }
  }

  // КОНТУР — равномерные точки
  function getUniformPoints(count) {
    const samples = 3000;
    const raw = [];
    let totalLen = 0;
    for (let i = 0; i <= samples; i++) {
      const t = (i / samples) * 2 * Math.PI;
      const x = heartX(t);
      const y = heartY(t);
      if (i > 0) {
        const dx = x - raw[raw.length - 1].x;
        const dy = y - raw[raw.length - 1].y;
        totalLen += Math.sqrt(dx * dx + dy * dy);
      }
      raw.push({ x, y, len: totalLen });
    }
    const step = totalLen / count;
    const result = [];
    let target = 0, j = 0;
    for (let i = 0; i <= samples; i++) {
      if (raw[i].len >= target) {
        result.push({ x: raw[i].x, y: raw[i].y });
        target += step;
        j++;
        if (j >= count) break;
      }
    }
    return result;
  }

  const totalOutline = 30;
  const uniformOutline = getUniformPoints(totalOutline);
  uniformOutline.forEach((pt, i) => {
    outlinePoints.push({
      x: pt.x * scale,
      y: pt.y * scale,
      size: 8,
      alpha: 0,
      delay: i * 0.1
    });
  });

  // Рандомный порядок появления для заполнения
  fillPoints.sort(() => Math.random() - 0.5);

  const fillStartDelay = totalOutline * 0.1 + 0.3;
  fillPoints.forEach((p, i) => {
    p.delay = fillStartDelay + i * 0.015; // постепенно
  });

  const allPoints = [...outlinePoints, ...fillPoints];
  let time = 0;
  let bigTextAlpha = 0;

  function animate() {
    time += 0.02;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const offsetX = canvas.width / 2;
    const offsetY = canvas.height / 2 + (canvas.height * 0.02);

    allPoints.forEach((p) => {
      if (time > p.delay) {
        if (p.alpha < 1) p.alpha += 0.05;
      }
      if (p.alpha > 0) {
        const x = offsetX + p.x;
        const y = offsetY - p.y;

        ctx.font = `bold ${p.size}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // GLOW
        ctx.globalAlpha = p.alpha * 0.35;
        ctx.shadowColor = "#00BFFF";
        ctx.shadowBlur = 25;
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText(text, x, y);

        ctx.globalAlpha = p.alpha * 0.45;
        ctx.shadowBlur = 12;
        ctx.fillText(text, x, y);

        // Белое слово
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText(text, x, y);
      }
    });

    // БОЛЬШАЯ НАДПИСЬ
    const lastDelay = fillPoints[fillPoints.length - 1].delay;
    if (time > lastDelay + 1.5) {
      bigTextAlpha += 0.02;
      if (bigTextAlpha > 0.95) bigTextAlpha = 0.95;

      ctx.globalAlpha = bigTextAlpha;
      ctx.shadowColor = "#00BFFF";
      ctx.shadowBlur = 35;
      ctx.font = `bold 26px Georgia`;
      ctx.fillStyle = "#00BFFF";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("I Love You", canvas.width / 2, canvas.height / 2);
      ctx.shadowBlur = 0;
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    allPoints.forEach(p => p.alpha = 0);
    bigTextAlpha = 0;
    time = 0;
    animate();
  });
</script>
</body>
</html>
