<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const text = "I love you";
  const outlinePoints = [];
  const fillPoints = [];

  function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }

  const scale = 6.5;

  // Проверка: внутри ли точка сердца (по формуле)
  function isInsideHeart(x, y) {
    // Переводим в нормализованные координаты (обратно к формуле)
    const nx = x / scale;
    const ny = y / scale;
    // Уравнение сердца: (x^2 + y^2 - 1)^3 - x^2 * y^3 <= 0
    const a = nx * nx + ny * ny - 1;
    return a * a * a - nx * nx * ny * ny * ny <= 0;
  }

  // === РАВНОМЕРНОЕ ЗАПОЛНЕНИЕ ПО СЕТКЕ ===
  const gridStep = 0.35; // шаг сетки (меньше = плотнее)
  const maxX = 17;       // границы сердца по X (примерно)
  const maxY = 14;       // по Y

  for (let x = -maxX; x <= maxX; x += gridStep) {
    for (let y = -maxY; y <= maxY; y += gridStep) {
      // Небольшое случайное смещение, чтобы не было идеальной сетки
      const jitterX = (Math.random() - 0.5) * gridStep * 0.5;
      const jitterY = (Math.random() - 0.5) * gridStep * 0.5;
      const px = x + jitterX;
      const py = y + jitterY;

      if (isInsideHeart(px, py)) {
        fillPoints.push({
          x: px * scale,
          y: py * scale,
          size: 7,
          alpha: 0,
          delay: 0
        });
      }
    }
  }

  // КОНТУР — равномерные точки
  function getUniformPoints(count) {
    const samples = 3000;
    const raw = [];
    let totalLen = 0;
    for (let i = 0; i <= samples; i++) {
      const t = (i / samples) * 2 * Math.PI;
      const x = heartX(t);
      const y = heartY(t);
      if (i > 0) {
        const dx = x - raw[raw.length - 1].x;
        const dy = y - raw[raw.length - 1].y;
        totalLen += Math.sqrt(dx * dx + dy * dy);
      }
      raw.push({ x, y, len: totalLen });
    }
    const step = totalLen / count;
    const result = [];
    let target = 0, j = 0;
    for (let i = 0; i <= samples; i++) {
      if (raw[i].len >= target) {
        result.push({ x: raw[i].x, y: raw[i].y });
        target += step;
        j++;
        if (j >= count) break;
      }
    }
    return result;
  }

  const totalOutline = 30;
  const uniformOutline = getUniformPoints(totalOutline);
  uniformOutline.forEach((pt, i) => {
    outlinePoints.push({
      x: pt.x * scale,
      y: pt.y * scale,
      size: 8,
      alpha: 0,
      delay: i * 0.1
    });
  });

  // Заполнение — рандомный порядок появления
  fillPoints.sort(() => Math.random() - 0.5);

  const fillStartDelay = totalOutline * 0.1 + 0.3;
  fillPoints.forEach((p, i) => {
    p.delay = fillStartDelay + i * 0.03; // постепенно
  });

  const allPoints = [...outlinePoints, ...fillPoints];
  let time = 0;
  let bigTextAlpha = 0;

  function animate() {
    time += 0.02;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const offsetX = canvas.width / 2;
    const offsetY = canvas.height / 2 + (canvas.height * 0.02);

    allPoints.forEach((p) => {
      if (time > p.delay) {
        if (p.alpha < 1) p.alpha += 0.05;
      }
      if (p.alpha > 0) {
        const x = offsetX + p.x;
        const y = offsetY - p.y;

        ctx.font = `bold ${p.size}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // GLOW — голубое свечение вокруг белых слов
        ctx.globalAlpha = p.alpha * 0.35;
        ctx.shadowColor = "#00BFFF";
        ctx.shadowBlur = 25;
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText(text, x, y);

        ctx.globalAlpha = p.alpha * 0.45;
        ctx.shadowBlur = 12;
        ctx.fillText(text, x, y);

        // Белое слово
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText(text, x, y);
      }
    });

    // БОЛЬШАЯ ГОЛУБАЯ НАДПИСЬ В КОНЦЕ
    const lastDelay = fillPoints[fillPoints.length - 1].delay;
    if (time > lastDelay + 1.5) {
      bigTextAlpha += 0.02;
      if (bigTextAlpha > 0.95) bigTextAlpha = 0.95;

      ctx.globalAlpha = bigTextAlpha;
      ctx.shadowColor = "#00BFFF";
      ctx.shadowBlur = 35;
      ctx.font = `bold 26px Georgia`;
      ctx.fillStyle = "#00BFFF";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("I Love You", canvas.width / 2, canvas.height / 2);
      ctx.shadowBlur = 0;
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    allPoints.forEach(p => p.alpha = 0);
    bigTextAlpha = 0;
    time = 0;
    animate();
  });
</script>
</body>
</html>
