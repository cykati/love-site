<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const text = "I love you";
  const wordColor = "#00BFFF"; 
  const points = [];

  function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }

  const scale = 15;

  // Идём строго по контуру, начиная с правого верха (t = 0)
  // и по часовой стрелке вниз, потом влево, потом вверх.
  const total = 150; // меньше слов — чтобы не было каши
  
  for (let i = 0; i < total; i++) {
    // t идёт от 0 до 2*PI (полный круг по часовой стрелке)
    // t=0 — верхушка, t=PI/2 — правая сторона, t=PI — низ, t=3PI/2 — левая сторона
    const t = (i / total) * 2 * Math.PI;
    
    points.push({
      x: heartX(t) * scale,
      y: heartY(t) * scale,
      size: Math.random() * 6 + 5,
      alpha: 0,
      // Слова появляются не все сразу, а с задержкой по порядку
      delay: i * 0.08 
    });
  }

  let time = 0;

  function animate() {
    time += 0.02; // Медленно, как рукой рисуешь
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const offsetX = canvas.width / 2;
    const offsetY = canvas.height / 2 + (canvas.height * 0.1); 

    points.forEach((p) => {
      // Появляется, если время дошло до его задержки
      if (time > p.delay) {
        if (p.alpha < 1) p.alpha += 0.05; // Плавное проявление
      }

      if (p.alpha > 0) {
        ctx.globalAlpha = p.alpha;
        ctx.font = `bold ${p.size}px Arial`;
        ctx.fillStyle = wordColor;
        ctx.fillText(text, offsetX + p.x, offsetY - p.y);
      }
    });

    // Белая надпись в конце
    if (time > total * 0.08 + 1.5) {
      ctx.globalAlpha = 0.8;
      ctx.font = `bold 28px Georgia`;
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText("I Love You", offsetX, offsetY - (canvas.height * 0.08));
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    points.forEach(p => p.alpha = 0);
    time = 0;
    animate();
  });
</script>
</body>
</html>
