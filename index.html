<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const text = "I love you";
  const colors = ["#00FFFF", "#00BFFF", "#1E90FF", "#87CEFA", "#E0FFFF", "#ADD8E6"];
  const points = [];

  // Формулы сердца
  function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }

  // Собираем точки
  for (let i = 0; i < 1200; i++) {
    const t = Math.random() * 2 * Math.PI;
    const r = Math.random() * 0.9 + 0.1;
    points.push({ 
      x: heartX(t) * 15 * r, 
      y: heartY(t) * 15 * r,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: Math.random() * 8 + 6,
      alpha: Math.random() * 0.8 + 0.2 // Начальная яркость
    });
  }

  // ВАЖНО: Сортируем точки СТРОГО сверху вниз, чтобы они появлялись постепенно
  points.sort((a, b) => b.y - a.y);

  let currentIndex = 0;          // Сколько точек уже проявилось
  let showBigText = false;       // Пора ли показывать большую надпись
  let time = 0;                  // Счетчик времени для мерцания

  function animate() {
    time += 0.05; // Скорость мерцания

    // Очищаем экран
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    
    const offsetX = canvas.width / 2;
    const offsetY = canvas.height / 2 + 40;

    // 1. Рисуем уже проявившиеся маленькие слова
    for (let i = 0; i < currentIndex; i++) {
      const p = points[i];
      
      // Эффект мерцания: яркость плавно меняется
      const flicker = Math.sin(time + i) * 0.3 + 0.7; 

      ctx.font = `bold ${p.size}px Arial`;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha * flicker; 
      ctx.fillText(text, offsetX + p.x, offsetY - p.y);
    }

    // 2. Если все слова появились — рисуем большую надпись "I Love You"
    if (currentIndex >= points.length) {
      showBigText = true;
    }

    if (showBigText) {
      // Большая надпись тоже мерцает
      const bigFlicker = Math.sin(time * 0.5) * 0.2 + 0.8;
      
      // Тень для объема
      ctx.shadowColor = "#1E90FF";
      ctx.shadowBlur = 20;
      
      ctx.font = "bold 70px Georgia"; // Красивый шрифт как на видео
      ctx.fillStyle = "#FFFFFF";      // Белый цвет
      ctx.globalAlpha = bigFlicker;
      
      // Рисуем большую надпись по центру
      ctx.fillText("I Love You", offsetX, offsetY - 40);
      
      // Сбрасываем тень, чтобы не влияла на следующие кадры
      ctx.shadowBlur = 0;
    }

    // Сбрасываем прозрачность
    ctx.globalAlpha = 1;

    // 3. Логика постепенного появления
    // Если еще не все точки появились — добавляем несколько штук за кадр
    if (currentIndex < points.length) {
      currentIndex += 4; // Чем больше число, тем быстрее заполняется сердце
      if (currentIndex > points.length) currentIndex = points.length;
    }

    // Запускаем следующий кадр (плавно, 60 FPS)
    requestAnimationFrame(animate);
  }

  // Запускаем
  animate();

  // Перерисовка при изменении размера
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    // Сбрасываем анимацию при изменении размера
    currentIndex = 0;
    showBigText = false;
    animate();
  });
</script>
</body>
</html>
