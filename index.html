<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const text = "I love you";
  const wordColor = "#00BFFF";
  const points = [];

  function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }

  // МАЛЕНЬКОЕ СЕРДЦЕ
  const scale = 5; 

  // МАЛО СЛОВ
  const total = 35; 

  for (let i = 0; i < total; i++) {
    const t = (i / total) * 2 * Math.PI;
    points.push({
      x: heartX(t) * scale,
      y: heartY(t) * scale,
      size: Math.random() * 3 + 3,
      alpha: 0,
      delay: i * 0.1
    });
  }

  let time = 0;

  function animate() {
    time += 0.02;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const offsetX = canvas.width / 2;
    const offsetY = canvas.height / 2 + (canvas.height * 0.02);

    points.forEach((p) => {
      if (time > p.delay) {
        if (p.alpha < 1) p.alpha += 0.05;
      }
      if (p.alpha > 0) {
        ctx.globalAlpha = p.alpha;
        ctx.font = `bold ${p.size}px Arial`;
        ctx.fillStyle = wordColor;
        ctx.fillText(text, offsetX + p.x, offsetY - p.y);
      }
    });

    // Белая надпись в конце
    if (time > total * 0.1 + 1) {
      ctx.globalAlpha = 0.8;
      ctx.font = `bold 12px Georgia`;
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText("I Love You", offsetX, offsetY - (canvas.height * 0.01));
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    points.forEach(p => p.alpha = 0);
    time = 0;
    animate();
  });
</script>
</body>
</html>
