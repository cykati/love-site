<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const text = "I love you";
  const wordColor = "#00BFFF"; // Один цвет для всех слов

  const points = [];

  function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }

  // Рисуем ТОЛЬКО по контуру. Идём по кругу и добавляем точки.
  // Количество слов = 220 (это немного, но достаточно для контура)
  for (let i = 0; i < 220; i++) {
    const t = (i / 220) * 2 * Math.PI; // равномерно по кругу
    // Небольшой разброс, чтобы не было идеально ровно
    const jitter = (Math.random() - 0.5) * 0.3; 
    
    points.push({
      x: heartX(t + jitter) * 15,
      y: heartY(t + jitter) * 15,
      size: Math.random() * 8 + 6,
      delay: i // Задержка для появления (по порядку)
    });
  }

  // Сортируем так, чтобы рисовалось сверху вниз (по макушке к низу)
  points.sort((a, b) => b.y - a.y);

  let currentIndex = 0;
  let time = 0;

  function animate() {
    time += 0.05;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const offsetX = canvas.width / 2;
    const offsetY = canvas.height / 2 + 40;

    // Рисуем слова, которые уже появились
    for (let i = 0; i < currentIndex; i++) {
      const p = points[i];
      
      // Мерцание: плавно меняем прозрачность
      const flicker = Math.sin(time + i * 0.5) * 0.3 + 0.7;
      
      ctx.globalAlpha = flicker;
      ctx.font = `bold ${p.size}px Arial`;
      ctx.fillStyle = wordColor;
      ctx.fillText(text, offsetX + p.x, offsetY - p.y);
    }

    // Большая надпись в конце
    if (currentIndex >= points.length) {
      const bigFlicker = Math.sin(time * 0.5) * 0.3 + 0.7;
      ctx.globalAlpha = bigFlicker;
      ctx.shadowColor = "#1E90FF";
      ctx.shadowBlur = 20;
      ctx.font = "bold 70px Georgia";
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText("I Love You", offsetX, offsetY - 40);
      ctx.shadowBlur = 0;
    }

    ctx.globalAlpha = 1;

    // Добавляем по одному слову за кадр
    if (currentIndex < points.length) {
      currentIndex += 1;
    }

    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    currentIndex = 0;
    animate();
  });
</script>
</body>
</html>
