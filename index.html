<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const text = "I love you";
  const wordColor = "#00BFFF";
  const points = [];

  function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }

  const scale = 6.5; // чуть больше, чтобы буквы влезли
  const total = 35;

  for (let i = 0; i < total; i++) {
    const t = (i / total) * 2 * Math.PI;
    points.push({
      x: heartX(t) * scale,
      y: heartY(t) * scale,
      size: Math.random() * 4 + 8, // БУКВЫ КРУПНЕЕ (было 3+3)
      alpha: 0,
      delay: i * 0.1
    });
  }

  let time = 0;

  function animate() {
    time += 0.02;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const offsetX = canvas.width / 2;
    const offsetY = canvas.height / 2 + (canvas.height * 0.02);

    points.forEach((p) => {
      if (time > p.delay) {
        if (p.alpha < 1) p.alpha += 0.05;
      }
      if (p.alpha > 0) {
        const x = offsetX + p.x;
        const y = offsetY - p.y;

        // СВЕЧЕНИЕ ПОЗАДИ СЛОВА
        ctx.globalAlpha = p.alpha * 0.4;
        ctx.shadowColor = "#00BFFF";   // синее свечение
        ctx.shadowBlur = 18;
        ctx.font = `bold ${p.size}px Arial`;
        ctx.fillStyle = "#00BFFF";
        ctx.fillText(text, x, y);

        // САМО СЛОВО (ярче, поверх свечения)
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 8;
        ctx.fillStyle = "#7FE7FF"; // светлее для контраста
        ctx.fillText(text, x, y);

        // сброс
        ctx.shadowBlur = 0;
      }
    });

    // БЕЛАЯ НАДПИСЬ — СТРОГО ПО ЦЕНТРУ
    if (time > total * 0.1 + 1) {
      ctx.globalAlpha = 0.9;
      ctx.shadowColor = "#FFFFFF";
      ctx.shadowBlur = 20;
      ctx.font = `bold 22px Georgia`;
      ctx.fillStyle = "#FFFFFF";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      // Рисуем ровно в центре экрана
      ctx.fillText("I Love You", canvas.width / 2, canvas.height / 2);
      ctx.shadowBlur = 0;
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    points.forEach(p => p.alpha = 0);
    time = 0;
    animate();
  });
</script>
</body>
</html>
