<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const text = "I love you";
  const outlinePoints = [];

  function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }

  const scale = 6.5;

  // КОНТУР — равномерные точки
  function getUniformPoints(count) {
    const samples = 3000;
    const raw = [];
    let totalLen = 0;
    for (let i = 0; i <= samples; i++) {
      const t = (i / samples) * 2 * Math.PI;
      const x = heartX(t);
      const y = heartY(t);
      if (i > 0) {
        const dx = x - raw[raw.length - 1].x;
        const dy = y - raw[raw.length - 1].y;
        totalLen += Math.sqrt(dx * dx + dy * dy);
      }
      raw.push({ x, y, len: totalLen });
    }
    const stepU = totalLen / count;
    const result = [];
    let target = 0, j = 0;
    for (let i = 0; i <= samples; i++) {
      if (raw[i].len >= target) {
        result.push({ x: raw[i].x, y: raw[i].y });
        target += stepU;
        j++;
        if (j >= count) break;
      }
    }
    return result;
  }

  const totalOutline = 40;
  const uniformOutline = getUniformPoints(totalOutline);
  uniformOutline.forEach((pt, i) => {
    outlinePoints.push({
      x: pt.x * scale,
      y: pt.y * scale,
      size: 8,
      alpha: 0,
      delay: i * 0.15
    });
  });

  const allPoints = outlinePoints;
  let time = 0;
  let bigTextAlpha = 0;

  function animate() {
    time += 0.025;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const offsetX = canvas.width / 2;
    const offsetY = canvas.height / 2 + (canvas.height * 0.02);

    allPoints.forEach((p) => {
      if (time > p.delay) {
        if (p.alpha < 1) p.alpha += 0.025;
      }

      if (p.alpha > 0) {
        const x = offsetX + p.x;
        const y = offsetY - p.y;

        ctx.font = `bold ${p.size}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const glow = p.alpha * 25;

        ctx.globalAlpha = p.alpha * 0.35;
        ctx.shadowColor = "#00BFFF";
        ctx.shadowBlur = glow;
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText(text, x, y);

        ctx.globalAlpha = p.alpha * 0.45;
        ctx.shadowBlur = glow * 0.5;
        ctx.fillText(text, x, y);

        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText(text, x, y);
      }
    });

    // Большая надпись
    const lastDelay = outlinePoints[outlinePoints.length - 1].delay;
    if (time > lastDelay + 1.5) {
      bigTextAlpha += 0.02;
      if (bigTextAlpha > 0.95) bigTextAlpha = 0.95;

      ctx.globalAlpha = bigTextAlpha;
      ctx.shadowColor = "#00BFFF";
      ctx.shadowBlur = 35;
      ctx.font = `bold 26px Georgia`;
      ctx.fillStyle = "#00BFFF";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("I Love You", canvas.width / 2, canvas.height / 2);
      ctx.shadowBlur = 0;
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    allPoints.forEach(p => p.alpha = 0);
    bigTextAlpha = 0;
    time = 0;
    animate();
  });
</script>
</body>
</html>
