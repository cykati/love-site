<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const text = "I love you";
  const colors = ["#00FFFF", "#00BFFF", "#1E90FF", "#87CEFA", "#E0FFFF", "#ADD8E6"];
  const points = [];

  // Формулы сердца
  function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }

  // Собираем точки для заполнения сердца
  for (let i = 0; i < 1200; i++) {
    const t = Math.random() * 2 * Math.PI;
    const r = Math.random() * 0.9 + 0.1;
    points.push({ x: heartX(t) * 15 * r, y: heartY(t) * 15 * r });
  }

  // Сортировка точек сверху вниз (чтобы заполнялось красиво)
  points.sort((a, b) => b.y - a.y);

  let currentIndex = 0; // Счетчик, сколько слов уже нарисовано

  function drawNext() {
    // Если всё нарисовали — останавливаемся
    if (currentIndex >= points.length) return;

    const p = points[currentIndex];
    
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    
    const offsetX = canvas.width / 2;
    const offsetY = canvas.height / 2 + 40;

    // Рисуем слово со случайным размером и цветом
    const fontSize = Math.random() * 8 + 6;
    ctx.font = `bold ${fontSize}px Arial`;
    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
    ctx.fillText(text, offsetX + p.x, offsetY - p.y);

    // Увеличиваем счетчик
    currentIndex++;

    // Запускаем следующий шаг через 10 миллисекунд (можно менять: 5 — быстрее, 100 — медленнее)
    setTimeout(drawNext, 10); 
  }

  // Запускаем анимацию
  drawNext();

  // Перерисовка при изменении размера экрана
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    currentIndex = 0;
    drawNext();
  });
</script>
</body>
</html>
