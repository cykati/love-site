<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const text = "I love you";
  const outlinePoints = [];
  const fillPoints = [];

  function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }

  const scale = 6.5;

  // === РАВНОМЕРНОЕ РАСПРЕДЕЛЕНИЕ ТОЧЕК ПО КОНТУРУ ===
  // Сначала сэмплируем кривую, потом идём с равным шагом по длине.
  function getUniformPoints(count) {
    const samples = 3000;
    const raw = [];
    let totalLen = 0;

    // Замеряем длину кривой
    for (let i = 0; i <= samples; i++) {
      const t = (i / samples) * 2 * Math.PI;
      const x = heartX(t);
      const y = heartY(t);
      if (i > 0) {
        const dx = x - raw[raw.length - 1].x;
        const dy = y - raw[raw.length - 1].y;
        totalLen += Math.sqrt(dx * dx + dy * dy);
      }
      raw.push({ x, y, len: totalLen });
    }

    // Идём с равным шагом
    const step = totalLen / count;
    const result = [];
    let target = 0;
    let j = 0;
    for (let i = 0; i <= samples; i++) {
      if (raw[i].len >= target) {
        result.push({ x: raw[i].x, y: raw[i].y });
        target += step;
        j++;
        if (j >= count) break;
      }
    }
    return result;
  }

  // КОНТУР — 40 точек, равномерно
  const uniformOutline = getUniformPoints(40);
  uniformOutline.forEach((pt, i) => {
    outlinePoints.push({
      x: pt.x * scale,
      y: pt.y * scale,
      size: 10,
      alpha: 0,
      delay: i * 0.12
    });
  });

  // ЗАПОЛНЕНИЕ
  const totalFill = 60;
  for (let i = 0; i < totalFill; i++) {
    const t = Math.random() * 2 * Math.PI;
    const r = Math.random() * 0.85;
    fillPoints.push({
      x: heartX(t) * scale * r,
      y: heartY(t) * scale * r,
      size: 9,
      alpha: 0,
      delay: 0
    });
  }

  fillPoints.sort((a, b) => b.y - a.y);
  const fillStartDelay = 40 * 0.12 + 0.5;
  fillPoints.forEach((p, i) => {
    p.delay = fillStartDelay + i * 0.03;
  });

  const allPoints = [...outlinePoints, ...fillPoints];
  let time = 0;

  function animate() {
    time += 0.02;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const offsetX = canvas.width / 2;
    const offsetY = canvas.height / 2 + (canvas.height * 0.02);

    allPoints.forEach((p) => {
      if (time > p.delay) {
        if (p.alpha < 1) p.alpha += 0.05;
      }
      if (p.alpha > 0) {
        const x = offsetX + p.x;
        const y = offsetY - p.y;

        ctx.font = `bold ${p.size}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // GLOW: три слоя
        ctx.globalAlpha = p.alpha * 0.4;
        ctx.shadowColor = "#00BFFF";
        ctx.shadowBlur = 50;
        ctx.fillStyle = "#00BFFF";
        ctx.fillText(text, x, y);

        ctx.globalAlpha = p.alpha * 0.5;
        ctx.shadowBlur = 25;
        ctx.fillText(text, x, y);

        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#00BFFF";
        ctx.fillText(text, x, y);
      }
    });

    // БЕЛАЯ НАДПИСЬ
    if (time > fillPoints[fillPoints.length - 1].delay + 1.5) {
      ctx.globalAlpha = 0.9;
      ctx.shadowColor = "#FFFFFF";
      ctx.shadowBlur = 25;
      ctx.font = `bold 24px Georgia`;
      ctx.fillStyle = "#FFFFFF";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("I Love You", canvas.width / 2, canvas.height / 2);
      ctx.shadowBlur = 0;
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    allPoints.forEach(p => p.alpha = 0);
    time = 0;
    animate();
  });
</script>
</body>
</html>
